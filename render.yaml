services:
  - type: web
    name: creatina-lab-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:neon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CREATINA_ADMIN_PASSWORD
        sync: false
